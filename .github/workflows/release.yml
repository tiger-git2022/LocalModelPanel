name: 编译发布

# 推送 v* 标签（如 v1.0.0）时：在 Windows 上打包 LocalModelPanel.exe，压缩成 zip 并发布到 Releases。
# 推送到 main、提 PR 或手动运行时：只打包，产物在本次运行的 Artifacts 里下载，不发布。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path swap_panel.pyw -Pattern '^APP_VERSION = "([^"]+)"' | Select-Object -First 1
          if (-not $m) { Write-Error "swap_panel.pyw 里没有 APP_VERSION"; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "标签 ${{ github.ref_name }} 和 swap_panel.pyw 里的 APP_VERSION=$v 不一致"
            exit 1
          }

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller

      - name: 源码自检
        shell: pwsh
        run: |
          python -X faulthandler swap_panel.pyw --selftest 2>&1 | Out-Host
          if ($LASTEXITCODE) { Write-Error "源码自检失败，退出码 $LASTEXITCODE"; exit 1 }

      - name: 打包
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name LocalModelPanel `
            --icon "$PWD/assets/icon.ico" --add-data "$PWD/assets;assets" `
            --distpath out --workpath build --specpath build --exclude-module tkinter swap_panel.pyw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 打包后自检
        shell: pwsh
        run: |
          $env:SELFTEST_LOG = "$PWD/out/selftest.txt"
          $p = Start-Process out/LocalModelPanel/LocalModelPanel.exe -ArgumentList "--selftest" -PassThru
          $done = $p.WaitForExit(120000)
          if (Test-Path $env:SELFTEST_LOG) { Get-Content $env:SELFTEST_LOG -Encoding utf8 | Out-Host }
          if (-not $done) { $p.Kill(); Write-Error "自检超时（可能弹出了错误窗口）"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "自检失败，退出码 $($p.ExitCode)"; exit 1 }
          "打包后的 exe 自检通过"

      - name: 压缩
        shell: pwsh
        run: |
          $dir = "out/LocalModelPanel"
          Copy-Item README.md, CHANGELOG.md, LICENSE, config.example.yaml $dir
          $zip = "out/LocalModelPanel-${{ steps.ver.outputs.version }}.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          # Release 说明：取 CHANGELOG.md 里本版本那一节
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::IndexOf($lines, "## v${{ steps.ver.outputs.version }}")
          if ($start -lt 0) { $notes = "见 CHANGELOG.md" } else {
            $rest = $lines[($start + 1)..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          }
          $dl = "`n`n## 下载`n`n下载下面的 ``LocalModelPanel-${{ steps.ver.outputs.version }}.zip``，解压后双击 ``LocalModelPanel\LocalModelPanel.exe``。另外需要自己准备 llama-swap 和模型，详见 [README](https://github.com/${{ github.repository }}#readme)。"
          (($notes -join "`n").Trim() + $dl) | Set-Content out/notes.md -Encoding utf8

      - uses: actions/upload-artifact@v5
        with:
          name: LocalModelPanel-${{ steps.ver.outputs.version }}
          path: out/*.zip

      - name: 发布到 Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: 本地模型管理 v${{ steps.ver.outputs.version }}
          body_path: out/notes.md
          files: out/*.zip
